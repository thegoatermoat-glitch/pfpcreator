<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roblox Banner &amp; PFP Maker</title>
<style>
:root{color-scheme:dark;--l:#2e2e2e}*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#eee;font:14px system-ui,sans-serif;display:grid;grid-template-columns:310px 1fr;min-height:100vh}
aside{padding:16px;border-right:1px solid var(--l);display:flex;flex-direction:column;gap:9px;overflow:auto;max-height:100vh}
h1{font-size:16px;margin:0 0 4px}h2{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#888;margin:10px 0 0}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:#aaa;flex:1}
input,select,textarea,button{font:inherit;background:#161616;color:#eee;border:1px solid var(--l);border-radius:6px;padding:6px}
input[type=color]{padding:0;height:30px;width:100%}input[type=range]{padding:0;accent-color:#fff}
.row{display:flex;gap:8px}.seg{display:flex}.seg button{flex:1;border-radius:0}.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0}
.seg .on,.grid .on{background:#fff;color:#000}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.grid button{cursor:pointer}#dl{background:#fff;color:#000;font-weight:600;padding:10px;cursor:pointer}
main{display:grid;place-items:center;padding:16px}#wrap{position:relative;border:1px solid var(--l)}#wrap canvas{display:block}
@media(max-width:820px){body{grid-template-columns:1fr}aside{max-height:none;border:0}}
</style></head><body>
<aside>
<h1>Roblox Banner &amp; PFP Maker</h1>
<div class="seg"><button data-mode="pfp" class="on">PFP</button><button data-mode="banner">Banner</button></div>
<h2>Pose</h2><div id="poses" class="grid"></div>
<h2>Style</h2><div id="styles" class="grid"></div>
<h2>Camera</h2>
<label>Angle<input type="range" data-k="az" min="-90" max="90"></label>
<label>Tilt<input type="range" data-k="el" min="-15" max="45"></label>
<label>Zoom<input type="range" data-k="zoom" min=".5" max="2.5" step=".01"></label>
<label>Character X<input type="range" data-k="cx" min="0" max="1" step=".01"></label>
<label>Character Y<input type="range" data-k="cy" min="0" max="1" step=".01"></label>
<h2>Character &amp; location</h2>
<label>Spawn point<select data-g="spawn"></select></label>
<div class="row"><label>Skin<input type="color" data-g="skin"></label><label>Shirt<input type="color" data-g="shirt"></label><label>Pants<input type="color" data-g="pants"></label></div>
<button id="dl">Download PNG</button>
</aside>
<main><div id="wrap"></div><p id="ld" style="color:#888">Loading…</p></main>
<script>
function showErr(m){var d=document.getElementById('err');if(!d){d=document.createElement('pre');d.id='err';d.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;max-height:40vh;overflow:auto;background:#300;color:#fdd;padding:8px;font:12px monospace;z-index:9;white-space:pre-wrap;margin:0';document.body.appendChild(d)}d.textContent+=m+'\n'}
addEventListener('error',function(e){showErr('Error: '+e.message+(e.filename?' ('+e.filename.split('/').pop()+':'+e.lineno+')':''))});
addEventListener('unhandledrejection',function(e){showErr('Error: '+(e.reason&&e.reason.message||e.reason))});
</script>
<script type="module">
let THREE;try{THREE=await import('./vendor/three.module.js')}catch(e){THREE=await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js')}
const T={az:0,el:4,zoom:1,cx:.5,cy:.5};
const cfg={pfp:{...T,cx:.72},banner:{...T,cx:.8,el:3}};
const G={style:0,spawn:1,skin:'#f5cd30',shirt:'#527cae',pants:'#5b9a4c'};
let mode='pfp',busy=false;
const $=s=>document.querySelector(s),all=s=>[...document.querySelectorAll(s)];
// renderer + scene
const wrap=$('#wrap'),renderer=new THREE.WebGLRenderer({antialias:true});

const sky=new THREE.Color('#a9cdf2'),scene=new THREE.Scene();scene.background=sky;scene.fog=new THREE.Fog(sky,160,480);
const camera=new THREE.PerspectiveCamera(30,1,.5,800);

const sun=new THREE.DirectionalLight('#fff0d8',2.4);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-40,right:40,top:40,bottom:-40,near:1,far:200});sun.shadow.bias=-.0004;sun.shadow.camera.updateProjectionMatrix();scene.add(sun,sun.target);
// map from converted .rbxl
const S=await (await fetch('scene.json')).json();
const wedge=(()=>{const s=new THREE.Shape([new THREE.Vector2(.5,-.5),new THREE.Vector2(-.5,-.5),new THREE.Vector2(-.5,.5)]);
 const g=new THREE.ExtrudeGeometry(s,{depth:1,bevelEnabled:false});g.translate(0,0,-.5);g.rotateY(Math.PI/2);return g})();
const geos=[new THREE.BoxGeometry(1,1,1),wedge,new THREE.CylinderGeometry(.5,.5,1,24).rotateZ(Math.PI/2),new THREE.SphereGeometry(.5,20,14)];
const mats=()=>new THREE.MeshStandardMaterial({roughness:.9});const mx=new THREE.Matrix4(),col=new THREE.Color(),by=[[],[],[],[]];
const mk=p=>mx.set(p[4]*p[13],p[5]*p[14],p[6]*p[15],p[1],p[7]*p[13],p[8]*p[14],p[9]*p[15],p[2],p[10]*p[13],p[11]*p[14],p[12]*p[15],p[3],0,0,0,1);
for(const p of S.p){if(p[17]>0){const m=new THREE.Mesh(geos[p[0]],new THREE.MeshStandardMaterial({color:'#'+p[16],transparent:true,opacity:1-p[17],roughness:.9}));
 m.matrixAutoUpdate=false;m.matrix.copy(mk(p));m.castShadow=m.receiveShadow=true;scene.add(m)}else by[p[0]].push(p)}
by.forEach((a,t)=>{if(!a.length)return;const im=new THREE.InstancedMesh(geos[t],mats(),a.length);
 a.forEach((p,i)=>{im.setMatrixAt(i,mk(p));im.setColorAt(i,col.set('#'+p[16]))});im.castShadow=im.receiveShadow=true;scene.add(im)});
// character: your RobloxNoobRig model (faces -Z), baked-color texture recolored on the fly
const char=new THREE.Group(),rig=new THREE.Group();char.add(rig);scene.add(char);
const NJ=await (await fetch('noob.json')).json(),img=new Image();img.src='NoobTexture.png';await img.decode();
const tc=document.createElement('canvas');tc.width=img.width;tc.height=img.height;const tx=tc.getContext('2d',{willReadFrequently:true});tx.drawImage(img,0,0);
const src=tx.getImageData(0,0,tc.width,tc.height),out=tx.createImageData(tc.width,tc.height);
const BASE={skin:[245,205,48],shirt:[82,124,174],pants:[91,154,76]},KEYS=Object.keys(BASE),cls=new Int8Array(tc.width*tc.height).fill(-1),kk=new Float32Array(cls.length);
for(let i=0;i<cls.length;i++){const q=src.data,p=[q[i*4],q[i*4+1],q[i*4+2]];if(q[i*4+3]<8)continue;let best=1e9;
 KEYS.forEach((n,j)=>{const b=BASE[n],k=(p[0]*b[0]+p[1]*b[1]+p[2]*b[2])/(b[0]**2+b[1]**2+b[2]**2),r=Math.hypot(p[0]-k*b[0],p[1]-k*b[1],p[2]-k*b[2]);if(r<best&&r<45&&k>.1&&k<1.15){best=r;cls[i]=j;kk[i]=k}})}
const tex=new THREE.CanvasTexture(tc);tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=8;
const mat=new THREE.MeshStandardMaterial({map:tex,roughness:.8});
function colors(){const rgb=KEYS.map(k=>{const n=parseInt(G[k].slice(1),16);return[n>>16,n>>8&255,n&255]}),o=out.data;o.set(src.data);
 for(let i=0;i<cls.length;i++){const j=cls[i];if(j<0)continue;for(let c=0;c<3;c++)o[i*4+c]=Math.min(255,rgb[j][c]*kk[i])}
 tx.putImageData(out,0,0);tex.needsUpdate=true}
const J={},KEY={Torso:'t',Head:'h',LeftArm:'la',RightArm:'ra',LeftLeg:'ll',RightLeg:'rl'},TP=[0,2,0];
for(const p of NJ){const g=new THREE.BufferGeometry(),isT=p.n=='Torso';
 g.setAttribute('position',new THREE.Float32BufferAttribute(p.pos,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(p.nrm,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(p.uv,2));
 if(isT)g.translate(p.piv[0]-TP[0],p.piv[1]-TP[1],p.piv[2]-TP[2]);
 const m=new THREE.Mesh(g,mat);m.castShadow=true;const j=new THREE.Group();j.add(m);J[KEY[p.n]]=j;
 const leg=p.n.endsWith('Leg'),pp=isT?TP:p.piv;j.position.set(...(isT||leg?[pp[0],pp[1],pp[2]]:[pp[0]-TP[0],pp[1]-TP[1],pp[2]-TP[2]]));
 (isT||leg?rig:J.t).add(j)}
// poses (radians: [x,y,z]). arm/leg +x swings forward, arm +z on la / -z on ra swings outward, torso -x leans forward
const POSES={
 Idle:{t:[0,0,0],h:[0,.1,.03],la:[0,0,.12],ra:[0,0,-.12],ll:[0,0,.03],rl:[0,0,-.03],yaw:-.25},
 Wave:{h:[0,.1,.08],la:[0,0,.1],ra:[0,0,-2.65],ll:[0,0,.03],rl:[0,0,-.03],yaw:-.2,wave:1},
 'T-Pose':{la:[0,0,1.57],ra:[0,0,-1.57]},
 Victory:{h:[.15,0,0],la:[0,0,2.6],ra:[0,0,-2.6],ll:[0,0,.12],rl:[0,0,-.12]},
 Walk:{t:[0,.12,0],h:[0,-.1,0],la:[.7,0,.05],ra:[-.7,0,-.05],ll:[-.5,0,0],rl:[.5,0,0],yaw:-.45},
 Run:{t:[-.3,.2,0],h:[.25,-.15,0],la:[1.2,0,.1],ra:[-1.2,0,-.1],ll:[-1,0,0],rl:[1,0,0],yaw:-.6,y:.3},
 Jump:{t:[-.05,0,0],h:[.1,0,0],la:[0,0,2.5],ra:[0,0,-2.5],ll:[-.5,0,.15],rl:[.5,0,-.15],y:1.3},
 Hero:{t:[.06,0,0],h:[.1,0,0],la:[0,0,.55],ra:[0,0,-.55],ll:[0,0,.18],rl:[0,0,-.18],yaw:-.2},
 Point:{h:[0,-.1,0],la:[0,0,.1],ra:[1.5,0,-.1],ll:[0,0,.05],rl:[0,0,-.05],yaw:-.55},
 Sit:{t:[-.05,0,0],la:[.35,0,.1],ra:[.35,0,-.1],ll:[1.57,0,.05],rl:[1.57,0,-.05],yaw:-.3,y:-1.5}};
let pose='Idle';const JK=['t','h','la','ra','ll','rl'],cur={},Z=[0,0,0];let cy=0,cyaw=0;JK.forEach(k=>cur[k]=[0,0,0]);
function step(t,snap){const P=POSES[pose],a=snap?1:.14;
 JK.forEach(k=>{const v=P[k]||Z;for(let i=0;i<3;i++)cur[k][i]+=(v[i]-cur[k][i])*a;J[k].rotation.set(...cur[k])});
 cy+=((P.y||0)-cy)*a;cyaw+=((P.yaw||0)-cyaw)*a;const s=Math.sin(t*1.4)*.03;
 J.la.rotation.x+=s;J.ra.rotation.x-=s;J.h.rotation.y+=Math.sin(t*.6)*.04;if(P.wave)J.ra.rotation.z+=Math.sin(t*7)*.28;
 rig.position.y=cy;rig.rotation.y=cyaw}
const pg=$('#poses');Object.keys(POSES).forEach(n=>{const b=document.createElement('button');b.textContent=n;b.className=n==pose?'on':'';
 b.onclick=()=>{pose=n;pg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x==b))};pg.append(b)});
// styles: render to a 2x target, then a full-screen stylize pass (ink outlines from depth + luminance edges)
const STY=['Standard','Comic','Noir','Pixel','Neon','Sketch'];
const rt=new THREE.WebGLRenderTarget(2,2,{depthTexture:new THREE.DepthTexture(2,2,THREE.UnsignedIntType)});
const pm=new THREE.ShaderMaterial({depthTest:false,depthWrite:false,uniforms:{tC:{value:rt.texture},tD:{value:rt.depthTexture},res:{value:new THREE.Vector2()},near:{value:.5},far:{value:800},style:{value:0}},
 vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}',fragmentShader:`uniform sampler2D tC,tD;uniform vec2 res;uniform float near,far,style;varying vec2 vUv;
float lin(vec2 u){float d=texture2D(tD,u).x;return near*far/(far-d*(far-near));}
vec3 S(vec2 u){return pow(texture2D(tC,u).rgb,vec3(.4545));}
float L(vec2 u){return dot(S(u),vec3(.299,.587,.114));}
float H(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
void main(){vec2 uv=vUv;float asp=res.x/res.y;
 if(style>2.5&&style<3.5){float k=res.y/100.;uv=(floor(uv*res/k)+.5)*k/res;}
 vec2 e=vec2(res.y*.0033)/res,ex=vec2(e.x,0.),ey=vec2(0.,e.y);
 float d=lin(uv),lap=(abs(lin(uv+ex)+lin(uv-ex)-2.*d)+abs(lin(uv+ey)+lin(uv-ey)-2.*d))/d;
 float de=smoothstep(.012,.035,lap),le=smoothstep(.12,.3,abs(L(uv+ex)-L(uv-ex))+abs(L(uv+ey)-L(uv-ey))),ink=max(de,le*.8);
 vec3 c=S(uv);float l=dot(c,vec3(.299,.587,.114));
 if(style<1.5){c=mix(vec3(l),c,1.35);c=floor(c*4.+.5)/4.;
  vec2 f=fract(mat2(.707,-.707,.707,.707)*(uv*vec2(asp,1.)*80.))-.5;
  c*=1.-.45*step(length(f),(1.-l)*.62)*smoothstep(.7,.35,l);c=mix(c,vec3(.04,.03,.07),ink);}
 else if(style<2.5){float g=floor(smoothstep(.12,.88,l)*5.+.5)/5.+(H(uv*res)-.5)*.07;
  g*=1.-.55*pow(length(vUv-.5)*1.2,2.);c=vec3(mix(g,0.,ink));}
 else if(style<3.5){c=floor(c*6.+.5)/6.;c*=1.-.5*de;}
 else if(style<4.5){float g=smoothstep(0.,.8,l);c=mix(vec3(.05,.01,.18),vec3(1.,.2,.65),smoothstep(0.,.5,g));
  c=mix(c,vec3(.2,.95,1.),smoothstep(.55,1.,g));c=mix(c,vec3(.3,1.,1.),ink);}
 else{vec2 q=uv*vec2(asp,1.)*110.;float h1=step(fract(q.x+q.y),.22)*step(l,.62),h2=step(fract(q.x-q.y),.22)*step(l,.38);
  c=mix(vec3(.96,.94,.88),c,.3);c=mix(c,vec3(.12,.11,.15),max(h1*.6,h2*.7));c=mix(c,vec3(.1,.09,.12),ink);}
 gl_FragColor=vec4(c,1.);}`});
const ps=new THREE.Scene(),bs=new THREE.Vector2();ps.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),pm));
function render(){if(!G.style){renderer.render(scene,camera);return}
 renderer.getDrawingBufferSize(bs);const w=bs.x*2,h=bs.y*2;if(rt.width!=w||rt.height!=h)rt.setSize(w,h);
 pm.uniforms.res.value.set(w,h);pm.uniforms.style.value=G.style;
 renderer.setRenderTarget(rt);renderer.render(scene,camera);renderer.setRenderTarget(null);renderer.render(ps,camera)}
const sg=$('#styles');STY.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.className=i?'':'on';
 b.onclick=()=>{G.style=i;sg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x==b))};sg.append(b)});
// UI state
const sp=$('[data-g=spawn]');S.spawns.forEach((s,i)=>sp.add(new Option('Spawn '+(i+1),i)));
function place(){const s=S.spawns[G.spawn];char.position.set(s[0],s[1],s[2]);char.rotation.y=s[3];sun.target.position.copy(char.position);
 sun.position.set(char.position.x+35,char.position.y+55,char.position.z+25)}
function load(){all('[data-k]').forEach(e=>e.value=cfg[mode][e.dataset.k]);all('[data-g]').forEach(e=>e.value=G[e.dataset.g]);
 all('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode==mode))}
all('[data-k]').forEach(e=>e.oninput=()=>{cfg[mode][e.dataset.k]=+e.value});
all('[data-g]').forEach(e=>e.oninput=()=>{G[e.dataset.g]=e.dataset.g=='spawn'?+e.value:e.value;place();colors()});
all('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;load();fit()});
function fit(){const pf=mode=='pfp',aw=Math.max(260,Math.min(innerWidth>820?innerWidth-370:innerWidth-34,960)),w=pf?Math.min(aw,innerHeight-60,640):aw,h=pf?w:w/3,d=Math.min(devicePixelRatio,2);
 renderer.setPixelRatio(d);renderer.setSize(w,h)}
// camera
function cam(){const c=cfg[mode],pf=mode=='pfp',fov=pf?28:38,cv=renderer.domElement,asp=cv.width/cv.height;camera.fov=fov;camera.aspect=asp;
 const a=char.rotation.y+c.az*Math.PI/180,e=c.el*Math.PI/180,t=new THREE.Vector3(0,pf?4.5:3,0).add(char.position).add(rig.position),d=(pf?4.6:11)/c.zoom;

 const vh=2*d*Math.tan(fov*Math.PI/360),r=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,0),u=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,1);

// idle animation + loop
(function tick(t){requestAnimationFrame(tick);if(busy)return;t/=1000;
 step(t);cam();render()})(0);
// export
$('#dl').onclick=()=>{busy=true;const [w,h]=mode=='pfp'?[1024,1024]:[1920,640];renderer.setPixelRatio(1);renderer.setSize(w,h,false);step(performance.now()/1000,true);cam();render();
 const o=document.createElement('canvas');o.width=w;o.height=h;const x=o.getContext('2d');x.drawImage(renderer.domElement,0,0);

addEventListener('resize',fit);place();colors();load();fit();$('#ld').remove();
</script></body></html>
